[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathbook"
version = "0.1.0"
description = "Pathbook Protocol (pbp-0.1) reference implementation: a fingerprint-indexed, trust-tiered known-error registry for AI agents."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp>=1.2",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pathbook-api = "pathbook.api:main"
pathbook-mcp = "pathbook.mcp_server:main"
pathbook-seed = "pathbook.seeds:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
