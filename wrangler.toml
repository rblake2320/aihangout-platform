name = "aihangout-platform"
main = "dist/worker.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.development]
[[env.development.d1_databases]]
binding = "AIHANGOUT_DB"
database_name = "aihangout-dev"
database_id = "local"

[env.development.vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
# JWT_SECRET must be set via: wrangler secret put JWT_SECRET --env development

[env.staging]
name = "aihangout-staging"

[[env.staging.d1_databases]]
binding = "AIHANGOUT_DB"
database_name = "aihangout-staging"
database_id = "0783889d-3191-46ec-b47a-9aa74147b64a"

[[env.staging.kv_namespaces]]
binding = "AIHANGOUT_KV"
id = "c8a1217f6f2a43028e6b8051fd2ab9d7"

[env.staging.vars]
ENVIRONMENT = "staging"
API_VERSION = "v1"
BETA_MODE = "true"
# Mobile companion enrollment identity (src/mobile-enrollment.js). Non-secret build
# identity constants: the Android applicationId and the SHA-256 of the APK signing
# certificate. Staging pins this machine's DEBUG keystore cert; production must pin a
# release signing identity instead (owner decision) -- never copy this block to prod.
MOBILE_APP_ID = "com.aihangout.companion"
MOBILE_APP_CERT_SHA256 = "b709192f6a09f7c1a93addb13d766f4ad5f134747862d4b7f4814357d9fc0b4e"
# Mobile "Ask AI for help" assistance (src/mobile-assistance.js). OFF by default;
# every provider call requires ALL of: MOBILE_ASSISTANCE_ENABLED="1",
# `wrangler secret put OPENAI_API_KEY --env staging`, OPENAI_MODEL set here, and
# remaining budget under MOBILE_ASSISTANCE_MAX_CALLS (durable count, default 5).
# Owner authorized up to $5 of testing on 2026-09-10; five durable call slots.
MOBILE_ASSISTANCE_ENABLED = "1"
MOBILE_ASSISTANCE_MAX_CALLS = "5"
OPENAI_MODEL = "gpt-5.6-sol"
# JWT_SECRET must be set via: wrangler secret put JWT_SECRET --env staging
# AI_ARMY_SERVER must be set via: wrangler secret put AI_ARMY_SERVER --env staging

[env.production]
name = "aihangout-ai"
routes = [
  { pattern = "aihangout.ai/*", zone_name = "aihangout.ai" },
  { pattern = "www.aihangout.ai/*", zone_name = "aihangout.ai" }
]

[[env.production.d1_databases]]
binding = "AIHANGOUT_DB"
database_name = "aihangout-database"
database_id = "88deba8c-079c-412e-a41a-826e8916f334"

[[env.production.kv_namespaces]]
binding = "AIHANGOUT_KV"
id = "9cd27d12b2c341b3a5b77f47b69a89c0"

[env.production.vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
# AI_ARMY_SERVER must be set via: wrangler secret put AI_ARMY_SERVER --env production
BETA_MODE = "false"

[triggers]
crons = ["0 6 * * *"]   # 6 AM UTC daily harvest

[build]
command = "npm run build:worker"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
