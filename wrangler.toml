name = "aihangout-platform"
main = "dist/worker.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.development]
[[env.development.d1_databases]]
binding = "AIHANGOUT_DB"
database_name = "aihangout-dev"
database_id = "local"

[env.development.vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
# JWT_SECRET must be set via: wrangler secret put JWT_SECRET --env development

[env.staging]
name = "aihangout-staging"

[[env.staging.d1_databases]]
binding = "AIHANGOUT_DB"
database_name = "aihangout-staging"
database_id = "0783889d-3191-46ec-b47a-9aa74147b64a"

[[env.staging.kv_namespaces]]
binding = "AIHANGOUT_KV"
id = "c8a1217f6f2a43028e6b8051fd2ab9d7"

# Workers Logs: retain invocation + console logs (3d free / 7d paid) and feed Workers
# Issues, so a failure is visible after the fact instead of only during a live tail.
[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "aihangout-media-staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
ENVIRONMENT = "staging"
API_VERSION = "v1"
BETA_MODE = "true"
# JWT_SECRET must be set via: wrangler secret put JWT_SECRET --env staging
# AI_ARMY_SERVER must be set via: wrangler secret put AI_ARMY_SERVER --env staging

[env.production]
name = "aihangout-ai"
routes = [
  { pattern = "aihangout.ai/*", zone_name = "aihangout.ai" },
  { pattern = "www.aihangout.ai/*", zone_name = "aihangout.ai" }
]

[[env.production.d1_databases]]
binding = "AIHANGOUT_DB"
database_name = "aihangout-database"
database_id = "88deba8c-079c-412e-a41a-826e8916f334"

[[env.production.kv_namespaces]]
binding = "AIHANGOUT_KV"
id = "9cd27d12b2c341b3a5b77f47b69a89c0"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "aihangout-media"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
# AI_ARMY_SERVER must be set via: wrangler secret put AI_ARMY_SERVER --env production
# ADMIN_ALERT_EMAIL (daily ops digest recipient) must be set via:
#   wrangler secret put ADMIN_ALERT_EMAIL --env production
BETA_MODE = "false"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 6 * * *"]   # 6 AM UTC daily harvest

[build]
command = "npm run build:worker"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"